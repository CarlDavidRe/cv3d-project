[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cv3d-nbv"
version = "0.1.0"
description = "Frozen-feature probes for next-best-view prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<2.4",
    "Pillow>=9.5",
    "PyYAML>=6.0",
    "torch>=2.1",
    "torchvision>=0.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nbv = ["geometry/*.csv"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
