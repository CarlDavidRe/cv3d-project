experiment:
  deterministic: true
  name: backbone_sweep
  phase: phase1
  seed: 0
paths:
  data_root: data/NUM
  model_cache_root: data/cache/models
  output_root: outputs
phase1:
  num_anchors: 48
  num_dataset:
    split_manifest: data/splits/num_v1.json
    target_name: PSNR
probe:
  baselines:
  - name: train_mean_map
    type: train_mean_map
  device: auto
  dinov2:
    model_name: dinov2_vitb14
    pretrained: true
  evaluation:
    batch_size: 1024
    ndcg_k: 5
  extraction_batch_size:
    dinov2: 64
    imagenet_vit: 64
    raw_rgb: 256
    vggt: 32
  feature_cache:
    dtype: float16
    rebuild: false
    root: data/cache/features
  head:
    dropout: 0.0
    hidden_dim: 128
  imagenet_vit:
    pretrained: true
  mask_source_view: true
  max_samples_per_split: null
  raw_rgb:
    output_size: 16
  target_direction: auto
  training:
    batch_size: 256
    epochs: 50
    huber_delta: 1.0
    learning_rate: 0.001
    patience: 8
    ranking_margin: 0.0
    ranking_weight: 0.1
    weight_decay: 0.0001
  variants:
  - backbone: raw_rgb
    components:
    - flattened_rgb
    name: raw_rgb_16x16_mlp
  - backbone: imagenet_vit
    components:
    - pooled_patch
    name: imagenet_vit_pooled_patch
  - backbone: imagenet_vit
    components:
    - cls_token
    name: imagenet_vit_cls_token
  - backbone: dinov2
    components:
    - pooled_patch
    name: dinov2_pooled_patch
  - backbone: dinov2
    components:
    - cls_token
    name: dinov2_cls_token
  - backbone: vggt
    components:
    - pooled_patch
    name: vggt_pooled_patch
  - backbone: vggt
    components:
    - max_pooled_patch
    name: vggt_max_pooled_patch
  - backbone: vggt
    components:
    - pooled_camera
    name: vggt_camera_token
  - backbone: vggt
    components:
    - pooled_register
    name: vggt_pooled_register
  - backbone: vggt
    components:
    - pooled_camera
    - pooled_patch
    name: vggt_camera_patch
  vggt:
    image_size: 518
    layer_index: -1
    model_id: facebook/VGGT-1B
schema_version: 1
