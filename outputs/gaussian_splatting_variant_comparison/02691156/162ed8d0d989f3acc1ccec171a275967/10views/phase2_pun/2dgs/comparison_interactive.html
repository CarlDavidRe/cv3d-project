  const bounds = canvas.getBoundingClientRect();
  const ratio = Math.max(1, window.devicePixelRatio || 1);

  if(showBox.checked){
    if(separated){ if(showGt.checked)drawBox(-1); if(showPrediction.checked)drawBox(1); }
