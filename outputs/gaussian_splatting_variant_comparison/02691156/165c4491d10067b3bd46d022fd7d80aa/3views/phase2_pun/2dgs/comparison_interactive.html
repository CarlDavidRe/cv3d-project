window.addEventListener("resize", resize);
function frame() { if(autoRotate && !dragging){ yaw += .004; dirty=true; } if(dirty)render(); requestAnimationFrame(frame); }
resize(); requestAnimationFrame(frame);
</script>
</body>
</html>
