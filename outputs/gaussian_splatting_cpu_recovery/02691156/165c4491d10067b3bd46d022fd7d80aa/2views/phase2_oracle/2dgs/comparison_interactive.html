let width = 1, height = 1, yaw = -0.55, pitch = -0.35, zoom = 1;

function resize() {
  const bounds = canvas.getBoundingClientRect();

function setView(nextYaw, nextPitch) { yaw = nextYaw; pitch = nextPitch; dirty = true; }
