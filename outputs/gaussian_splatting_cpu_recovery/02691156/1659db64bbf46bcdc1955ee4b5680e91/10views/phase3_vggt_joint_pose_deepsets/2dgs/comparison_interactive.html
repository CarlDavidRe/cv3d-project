  const bounds = canvas.getBoundingClientRect();

function reset() { yaw = -0.55; pitch = -0.35; zoom = 1; dirty = true; }
function setView(nextYaw, nextPitch) { yaw = nextYaw; pitch = nextPitch; dirty = true; }
