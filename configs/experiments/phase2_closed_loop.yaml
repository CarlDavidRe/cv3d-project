schema_version: 1

experiment:
  phase: phase2
  name: phase2_closed_loop_reconstruction
  seed: 0
  deterministic: true

paths:
  data_root: data/NUM
  mesh_root: data/ShapeNetCore.v2
  visibility_cache_root: data/cache/visibility
  reconstruction_cache_root: data/cache/reconstruction
  output_root: outputs
  model_cache_root: data/cache/models

phase2:
  # Load and save the resolved Step 9 camera/render settings with each run.
  visibility_config: configs/experiments/phase2_visibility.yaml
  evaluation:
    geometry_validation_status: num_camera_bbox_centered
    split: test
    split_manifest: data/splits/num_v1.json
    object_ids: []              # Optional explicit subset of this split.
    limit: null
    skip_missing_caches: false  # Opt in for provisional runs during precompute.
    policies: [random, farthest, pun, vggt, oracle]
    max_acquired_views: 10      # Includes the initial views.
    initial_anchor_ids: [0]
    invalid_anchor_ids: []
    # Report both absolute VisA and coverage normalized by the union reachable
    # from every available, non-invalid anchor.
    coverage_target: vis_a      # Explicit override of a cache's default target.

    # Secondary reconstruction-quality evaluation. Policies still receive no
    # geometry: their selected RGB prefixes are reconstructed afterward by the
    # same frozen VGGT point-map backend and compared with the ShapeNet mesh.
    reconstruction:
      enabled: true
      policies: [pun, vggt]
      # Joint VGGT inference is required separately for each prefix. These
      # fixed checkpoints balance curve resolution and runtime; caches are
      # shared across runs and with Phase 3 by exact ordered-history identity.
      view_counts: [1, 2, 3, 5, 10]
      backend: vggt
      model_id: facebook/VGGT-1B
      image_size: 518
      point_source: point_map
      device: auto
      confidence_percentile: 50.0
      foreground_threshold: 0.9607843137254902  # 245 / 255 NUM white-background mask.
      predicted_point_count: 10000
      ground_truth_point_count: 10000
      chamfer_chunk_size: 1024
      fscore_thresholds: [0.01, 0.02]  # Fractions of GT bounding-box diameter.
      mesh_relative_path: models/model_normalized.ply
      mesh_scale: 2.0
      mesh_centering: bounding_box

  # Released PUN/UPNet inference only; no optimizer or local training.
  pun:
    source_repository: https://github.com/ZhangLab-DeepNeuroCogLab/PUN
    source_commit: aa6f8f4f12154854a4c1867209725c80475af102
    source_policy_file_sha256: 09a7ad1f0cc2e54c8032dc38169995c75707601c68cace6a013c2e9bb085445c
    source_viewpoint_file_sha256: 2f0abec6c5405f3d21cd70f0fa0b628f5560200341bff338573a65b2c9c696f7
    release_name: vit_small_patch16_224_PSNR_250425172703
    model_name: vit_small_patch16_224
    target_name: PSNR
    device: auto
    inference_batch_size: 16
    interpolation_degrees: 30.0
    suppression_threshold: 0.1
    selection_method: all
    delete_method: small
    checkpoint:
      path: data/cache/models/pun/vit_small_patch16_224_PSNR_250425172703/best_vit_regressor.pth
      download_url: https://drive.usercontent.google.com/download?id=1vpVFy2LQMjN0jTJ_o1chZ6B4nJNfNVKP&export=download&confirm=t
      sha256: 91b2065f7652aac0c84386d4af10cd0c1ae723c049c91e45ccc78722f70907ae
      download_if_missing: true

  # Validation-selected Phase 1 VGGT NUM predictor. The test feature cache
  # contains only independent, single-image frozen features and no geometry.
  vggt:
    variant: vggt_max_pooled_patch
    selection_split: val
    selection_metric: best_vggt_validation_ranking_across_regret_spearman_ndcg_at_5
    target_name: PSNR
    target_direction: lower
    map_frame: source_relative_canonical_anchor_zero
    feature_components: [max_pooled_patch]
    device: auto
    inference_batch_size: 32
    interpolation_degrees: 30.0
    suppression_threshold: 0.1
    allow_live_extraction: false
    model:
      model_id: facebook/VGGT-1B
      image_size: 518
      layer_index: -1
    checkpoint:
      path: outputs/phase1/backbone_sweep/seed_1/variants/vggt_max_pooled_patch/best.pt
      sha256: 6256e28c056615f699c6c5364a9aeaf141f730f4561a5af7f4c96ce7ab2d4938
    summary:
      path: outputs/phase1/backbone_sweep/seed_1/variants/vggt_max_pooled_patch/summary.json
      sha256: 65b7b4548292dfdf2e36161c2b4de0d1e40487ea454d7acec8e8ef500911e96f
    phase1_config:
      path: outputs/phase1/backbone_sweep/seed_1/config.yaml
      sha256: 5a742cb7e58a894a9329263a3f8440931a0294fc7e5785ebb778adc1e2a94b85
    feature_cache:
      path: data/cache/features/vggt/vggt_max_pooled_patch/test_3334dd9c7e19faf6.pt
      sha256: 5fd6c6f2e264fad7aa0e36a4351c4a0ac9222f0567195da700580b414ef19308
