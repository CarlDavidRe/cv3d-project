schema_version: 1

experiment:
  phase: phase3
  name: joint_history_control
  seed: 0
  deterministic: true

paths:
  data_root: data/NUM
  visibility_cache_root: data/cache/visibility
  output_root: outputs
  model_cache_root: data/cache/models

phase3:
  joint_control:
    # Identical Step 15 records and direct VisA labels used by Step 16.
    history_manifest: data/processed/histories/random_unique_v1/manifest.json
    coverage_target: vis_a
    device: auto
    matched_independent_config: configs/experiments/phase3_independent.yaml

    # Every feature starts with a complete live history-level forward.
    # Independent feature caches are read only for provenance validation and
    # are never used as joint inputs.
    backbone:
      model_id: facebook/VGGT-1B
      image_size: 518
      layer_index: -1
      components: [max_pooled_patch]
      expected_feature_dim: 2048

    # Masked mean is applied to history-conditioned view vectors so the head
    # has exactly the same dimensions and trainable capacity as Step 16.
    model:
      aggregation: masked_mean
      include_anchor_directions: true
      hidden_dim: 128
      dropout: 0.1

    # VGGT is frozen, so each complete joint history is encoded once and kept
    # in system RAM. Equal-length batches avoid separate VGGT forwards for
    # padding groups. If a batch is too large, CUDA OOM backoff halves it.
    frozen_feature_precompute:
      enabled: true
      batch_size: 4
      num_workers: 4
      pin_memory: true
      # Atomically persist 64 precompute batches (normally 256 histories) per
      # shard so a new Colab runtime can continue without repeating them.
      cache_every_batches: 64

    # Optimizer, loss, epochs, patience, seed, and effective batch size match
    # phase3_independent.yaml. Once joint features are materialized, the small
    # trainable head can use the full matched batch directly.
    training:
      epochs: 80
      batch_size: 64
      gradient_accumulation_steps: 1
      learning_rate: 0.001
      weight_decay: 0.0001
      huber_delta: 0.01
      ranking_weight: 0.1
      ranking_margin: 0.0
      patience: 10
      # Save after every 64 full head batches. Every batch is now an optimizer
      # boundary, so cached states never need to store partial gradients.
      checkpoint_every_batches: 64

    evaluation:
      batch_size: 256
      ndcg_k: 5

    # Runs before optimization and records accelerator peak memory for short
    # real histories. CPU runs record latency and an explicit null memory.
    memory_preflight:
      enabled: true
      history_lengths: [1, 2]
