schema_version: 1

experiment:
  phase: phase2
  name: visibility_cache
  seed: 0
  deterministic: true

paths:
  data_root: data/NUM
  mesh_root: data/ShapeNetCore.v2
  visibility_cache_root: data/cache/visibility
  output_root: outputs
  model_cache_root: data/cache/models

phase2:
  visibility:
    split: test
    split_manifest: data/splits/num_v1.json
    limit: null
    mesh_relative_path: models/model_normalized.ply

    # PUN metrics: vis = equal weight per visible face;
    # vis_a = visible-face area / total mesh area.
    target: vis_a

    # The prepared ShapeNet subset uses model_normalized.ply at scale 2.0.
    mesh_scale: 2.0

    # Camera geometry from the pinned PUN generator and Splatter NMR config.
    camera_radius: 2.73
    horizontal_fov_degrees: 30.0
    render_resolution: [256, 256]
    near: 1.2
    far: 4.0

    cull_backfaces: false
