schema_version: 1

experiment:
  phase: phase2
  name: visibility_cache
  seed: 0
  deterministic: true

paths:
  data_root: data/NUM
  mesh_root: data/ShapeNetCore.v2
  # NUM RGB camera calibration and tracking convention.
  visibility_cache_root: data/cache/visibility
  output_root: outputs
  model_cache_root: data/cache/models

phase2:
  visibility:
    split: test
    split_manifest: data/splits/num_v1.json
    limit: null
    mesh_relative_path: models/model_normalized.ply

    # PUN metrics: vis = equal weight per visible face;
    # vis_a = visible-face area / total mesh area.
    target: vis_a

    # Center source bounds at the origin, then apply the fixed PUN scale.
    mesh_centering: bounding_box
    mesh_scale: 2.0

    # Blender RGB calibration.
    # fx / width = fy / height = 525 / 512. See docs/num_camera_alignment.md.
    camera_radius: 2.73
    horizontal_fov_degrees: 51.98948897809546
    render_resolution: [256, 256]
    near: 1.2
    far: 4.0

    cull_backfaces: false
