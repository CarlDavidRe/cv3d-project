schema_version: 1

experiment:
  phase: phase1
  name: backbone_sweep
  seed: 0
  deterministic: true

paths:
  data_root: data/NUM
  output_root: outputs
  model_cache_root: data/cache/models

phase1:
  num_anchors: 48
  num_dataset:
    split_manifest: data/splits/num_v1.json
    target_name: PSNR

probe:
  device: auto
  target_direction: auto
  extraction_batch_size:
    raw_rgb: 256
    imagenet_vit: 64
    dinov2: 64
    vggt: 32
  mask_source_view: true
  max_samples_per_split: null

  feature_cache:
    root: data/cache/features
    dtype: float16
    rebuild: false

  variants:
    - name: raw_rgb_16x16_mlp
      backbone: raw_rgb
      components: [flattened_rgb]
    - name: imagenet_vit_pooled_patch
      backbone: imagenet_vit
      components: [pooled_patch]
    - name: imagenet_vit_cls_token
      backbone: imagenet_vit
      components: [cls_token]
    - name: dinov2_pooled_patch
      backbone: dinov2
      components: [pooled_patch]
    - name: dinov2_cls_token
      backbone: dinov2
      components: [cls_token]
    - name: vggt_pooled_patch
      backbone: vggt
      components: [pooled_patch]
    - name: vggt_max_pooled_patch
      backbone: vggt
      components: [max_pooled_patch]
    - name: vggt_camera_token
      backbone: vggt
      components: [pooled_camera]
    - name: vggt_pooled_register
      backbone: vggt
      components: [pooled_register]
    - name: vggt_camera_patch
      backbone: vggt
      components: [pooled_camera, pooled_patch]

  baselines:
    - name: train_mean_map
      type: train_mean_map
    - name: pun_upnet
      type: pun

  head:
    hidden_dim: 128
    dropout: 0.0

  training:
    epochs: 50
    batch_size: 256
    learning_rate: 0.001
    weight_decay: 0.0001
    huber_delta: 1.0
    ranking_weight: 0.1
    ranking_margin: 0.0
    patience: 8

  evaluation:
    batch_size: 1024
    ndcg_k: 5

  raw_rgb:
    output_size: 16
  imagenet_vit:
    pretrained: true
  dinov2:
    model_name: dinov2_vitb14
    pretrained: true
  vggt:
    model_id: facebook/VGGT-1B
    image_size: 518
    layer_index: -1

  # Official released PUN/UPNet checkpoint. No local PUN training is run.
  pun:
    source_repository: https://github.com/ZhangLab-DeepNeuroCogLab/PUN
    source_commit: aa6f8f4f12154854a4c1867209725c80475af102
    release_name: vit_small_patch16_224_PSNR_250425172703
    model_name: vit_small_patch16_224
    target_name: PSNR
    batch_size: 256
    num_workers: 4
    checkpoint:
      path: data/cache/models/pun/vit_small_patch16_224_PSNR_250425172703/best_vit_regressor.pth
      download_url: https://drive.usercontent.google.com/download?id=1vpVFy2LQMjN0jTJ_o1chZ6B4nJNfNVKP&export=download&confirm=t
      sha256: 91b2065f7652aac0c84386d4af10cd0c1ae723c049c91e45ccc78722f70907ae
      download_if_missing: true
