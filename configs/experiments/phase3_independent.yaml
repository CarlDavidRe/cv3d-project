schema_version: 1

experiment:
  phase: phase3
  name: independent_history_control
  seed: 0
  deterministic: true

paths:
  data_root: data/NUM
  visibility_cache_root: data/cache/visibility
  output_root: outputs
  model_cache_root: data/cache/models

phase3:
  independent_control:
    # Generated by scripts/build_history_dataset.py from the complete
    # train/validation/test visibility-cache cohort.
    history_manifest: data/processed/histories/random_unique_v1/manifest.json
    coverage_target: vis_a
    device: auto

    # These are the validation-selected Phase 1 VGGT representation caches.
    # The PSNR targets stored beside the vectors are never consumed here.
    features:
      variant: vggt_max_pooled_patch
      components: [max_pooled_patch]
      cache_paths:
        train: data/cache/features/vggt/vggt_max_pooled_patch/train_0b3f8faf5af10256.pt
        val: data/cache/features/vggt/vggt_max_pooled_patch/val_b3ca43046fab867c.pt
        test: data/cache/features/vggt/vggt_max_pooled_patch/test_3334dd9c7e19faf6.pt

    model:
      aggregation: masked_mean
      include_anchor_directions: true
      hidden_dim: 128
      dropout: 0.1

    training:
      epochs: 80
      batch_size: 64
      learning_rate: 0.001
      weight_decay: 0.0001
      huber_delta: 0.01
      ranking_weight: 0.1
      ranking_margin: 0.0
      patience: 10

    evaluation:
      batch_size: 256
      ndcg_k: 5

    # Uses a validation object and the unchanged Phase 2 evaluator. The first
    # canonical validation object is selected when object_id is null.
    closed_loop_smoke:
      enabled: true
      split: val
      object_id: null
      initial_anchor_ids: [0]
      max_acquired_views: 5
